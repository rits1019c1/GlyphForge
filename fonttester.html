<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTF Font Previewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-preview-area {
            min-height: 200px;
            word-break: break-all;
            transition: all 0.3s ease;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: border-color 0.3s, background-color 0.3s;
        }
        .drop-zone.dragover {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-800 tracking-tight text-slate-900 mb-2">OTF Font Previewer</h1>
            <p class="text-slate-500">OTFファイルをアップロードして、Web上でタイピングテストと詳細情報の確認ができます。</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Controls & Info -->
            <div class="lg:col-span-1 space-y-6">
                <div id="dropZone" class="drop-zone bg-white rounded-2xl p-8 text-center cursor-pointer shadow-sm">
                    <input type="file" id="fileInput" class="hidden" accept=".otf,.ttf,.woff,.woff2">
                    <div id="uploadPrompt">
                        <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                            </svg>
                        </div>
                        <p class="font-semibold text-slate-700">フォントを選択</p>
                        <p class="text-xs text-slate-400 mt-1">またはドラッグ＆ドロップ</p>
                    </div>
                    <div id="fileInfo" class="hidden text-left">
                        <p class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">読み込み済み</p>
                        <p id="fileName" class="font-bold text-slate-800 truncate"></p>
                        <button id="resetBtn" class="mt-4 text-xs text-red-500 hover:text-red-700 font-medium flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            別のフォントを読み込む
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 border-b pb-2 mb-4">表示設定</h3>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">フォントサイズ (<span id="sizeVal">48</span>px)</label>
                        <input type="range" id="fontSize" min="12" max="120" value="48" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">文字の色</label>
                        <div class="flex gap-2">
                            <input type="color" id="fontColor" value="#0f172a" class="h-8 w-12 rounded border-none cursor-pointer">
                            <input type="text" id="colorHex" value="#0F172A" class="flex-1 text-sm bg-slate-50 border rounded px-2 uppercase font-mono">
                        </div>
                    </div>
                </div>

                <div id="metadataPanel" class="bg-white rounded-2xl p-6 shadow-sm hidden">
                    <h3 class="font-bold text-slate-800 border-b pb-2 mb-4">フォント詳細</h3>
                    <div id="metadataContent" class="text-xs space-y-2 text-slate-600 font-mono">
                        <!-- Data will be injected here -->
                    </div>
                    <p class="mt-4 text-[10px] text-slate-400 leading-relaxed">※日本語フォントはファイルサイズが大きいため、解析に数秒かかる場合があります。</p>
                </div>
            </div>

            <!-- Right Column: Preview Area -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-widest">Preview & Type Here</label>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="setSample('pangram')" class="text-[11px] bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-full font-medium transition-colors">English</button>
                            <button onclick="setSample('iroha')" class="text-[11px] bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full font-medium transition-colors">いろは歌</button>
                            <button onclick="setSample('japanese')" class="text-[11px] bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full font-medium transition-colors">日本語混合</button>
                            <button onclick="setSample('symbols')" class="text-[11px] bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full font-medium transition-colors">数字・記号</button>
                        </div>
                    </div>
                    
                    <div id="previewContainer" class="relative group border-2 border-transparent focus-within:border-blue-100 rounded-xl transition-all">
                        <textarea id="sampleText" class="font-preview-area w-full border-none focus:ring-0 outline-none resize-none overflow-hidden p-2" rows="8" spellcheck="false" placeholder="ここに自由に文字を入力してください...">The quick brown fox jumps over the lazy dog.
いろはにほへと ちりぬるを
わかよたれそ つねならむ
うゐのおくやま けふこえて
あさきゆめみし ゑひもせす</textarea>
                        <div id="emptyOverlay" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                            <p class="text-xl text-slate-300 italic">フォントを読み込むとここに反映されます</p>
                        </div>
                    </div>
                    <p class="mt-4 text-xs text-slate-400">※上のエリアをクリックして、自由に文字を入力・編集できます。</p>
                </div>
            </div>

            <!-- Right Column: Preview Area -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-sm font-bold text-slate-400 uppercase tracking-widest">Preview & Edit</label>
                        <div class="flex space-x-2">
                            <button onclick="setSample(1)" class="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">Pangram</button>
                            <button onclick="setSample(2)" class="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">Alphabet</button>
                            <button onclick="setSample(3)" class="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded">Numbers</button>
                        </div>
                    </div>
                    
                    <div id="previewContainer" class="relative group">
                        <textarea id="sampleText" class="font-preview-area w-full border-none focus:ring-0 outline-none resize-none overflow-hidden" rows="5" spellcheck="false">The quick brown fox jumps over the lazy dog.
THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG.
あいうえお 漢字 テスト 1234567890</textarea>
                        <div id="emptyOverlay" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                            <p class="text-xl text-slate-300 italic">フォントを読み込むとここに反映されます</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">グリフ一覧 (Top 50)</h3>
                    <div id="glyphGrid" class="flex flex-wrap gap-2 text-3xl">
                        <!-- Glyphs will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const sampleText = document.getElementById('sampleText');
        const fontSize = document.getElementById('fontSize');
        const sizeVal = document.getElementById('sizeVal');
        const fontColor = document.getElementById('fontColor');
        const colorHex = document.getElementById('colorHex');
        const emptyOverlay = document.getElementById('emptyOverlay');
        const metadataPanel = document.getElementById('metadataPanel');
        const metadataContent = document.getElementById('metadataContent');
        const glyphGrid = document.getElementById('glyphGrid');
        const resetBtn = document.getElementById('resetBtn');

        let currentFont = null;
        let fontFace = null;

        // --- Event Listeners ---

        // Drag and Drop
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Controls
        fontSize.addEventListener('input', (e) => {
            sizeVal.textContent = e.target.value;
            sampleText.style.fontSize = `${e.target.value}px`;
        });

        fontColor.addEventListener('input', (e) => {
            const color = e.target.value;
            colorHex.value = color.toUpperCase();
            sampleText.style.color = color;
        });

        colorHex.addEventListener('input', (e) => {
            sampleText.style.color = e.target.value;
            fontColor.value = e.target.value;
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            location.reload();
        });

        // --- Core Functions ---

        async function handleFile(file) {
            if (!file.name.match(/\.(otf|ttf|woff|woff2)$/i)) {
                alert('OTF, TTF, WOFF, WOFF2 ファイル形式を選択してください。');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const arrayBuffer = e.target.result;
                
                try {
                    // Parse font metadata using opentype.js
                    currentFont = opentype.parse(arrayBuffer);
                    
                    // Register font for CSS usage
                    const fontName = 'CustomFont_' + Date.now();
                    fontFace = new FontFace(fontName, arrayBuffer);
                    
                    const loadedFace = await fontFace.load();
                    document.fonts.add(loadedFace);
                    
                    // Apply to UI
                    applyFont(fontName, file.name);
                    displayMetadata(currentFont);
                    renderGlyphs(currentFont);
                } catch (err) {
                    console.error(err);
                    alert('フォントの解析に失敗しました。ファイルが破損しているか、対応していない形式の可能性があります。');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function applyFont(fontName, fileName) {
            sampleText.style.fontFamily = `"${fontName}", sans-serif`;
            sampleText.style.fontSize = `${fontSize.value}px`;
            sampleText.style.color = fontColor.value;
            
            document.getElementById('uploadPrompt').classList.add('hidden');
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('fileName').textContent = fileName;
            emptyOverlay.classList.add('hidden');
            metadataPanel.classList.remove('hidden');
        }

        function displayMetadata(font) {
            const names = font.names;
            // 日本語名がある場合は日本語を、なければ英語を表示
            const getFontName = (key) => {
                return names[key]?.ja || names[key]?.en || '-';
            };

            const data = [
                { label: 'フォント名', value: getFontName('fontFamily') },
                { label: 'スタイル', value: getFontName('fontSubfamily') },
                { label: 'バージョン', value: getFontName('version') },
                { label: 'デザイナー', value: getFontName('designer') },
                { label: '著作権', value: getFontName('copyright') },
                { label: 'Units Per Em', value: font.unitsPerEm },
                { label: 'グリフ数', value: font.numGlyphs }
            ];

            metadataContent.innerHTML = data.map(item => `
                <div class="flex justify-between gap-4 py-1.5 border-b border-slate-50 last:border-0">
                    <span class="text-slate-400 shrink-0">${item.label}:</span>
                    <span class="text-slate-700 text-right break-all font-sans">${item.value}</span>
                </div>
            `).join('');
        }

        function renderGlyphs(font) {
            glyphGrid.innerHTML = '';
            // 主要な日本語文字と英数字を含むサンプルを表示
            const testChars = "あいうえおかきくけこアイウエオカキクケコABCDEFGHIJKLMN0123456789前後左右上下";
            let shownCount = 0;
            
            // フォント内のグリフからUnicodeを持っているものを探して表示
            for(let i=0; i<font.glyphs.length && shownCount < 60; i++) {
                const glyph = font.glyphs.get(i);
                if (glyph.unicode) {
                    const char = String.fromCodePoint(glyph.unicode);
                    const div = document.createElement('div');
                    div.className = 'w-12 h-12 flex items-center justify-center bg-slate-50 rounded hover:bg-blue-50 hover:text-blue-600 transition-colors cursor-default border border-slate-100';
                    div.style.fontFamily = sampleText.style.fontFamily;
                    div.textContent = char;
                    div.title = `Unicode: U+${glyph.unicode.toString(16).toUpperCase()}`;
                    glyphGrid.appendChild(div);
                    shownCount++;
                }
            }
        }

        window.setSample = function(type) {
            let text = "";
            switch(type) {
                case 'pangram':
                    text = "The quick brown fox jumps over the lazy dog.\nTHE QUICK BROWN FOX JUMPS OVER THE LAZY DOG.";
                    break;
                case 'iroha':
                    text = "いろはにほへと ちりぬるを\nわかよたれそ つねならむ\nうゐのおくやま けふこえて\nあさきゆめみし ゑひもせす";
                    break;
                case 'japanese':
                    text = "【日本語テスト】\n東の窓から射し込む光が、静かな部屋を照らしています。\n漢字：蒼穹、朦朧、薔薇、檸檬\nカタカナ：タイポグラフィ、プレビュー\n記号：！？（）｛｝［］";
                    break;
                case 'symbols':
                    text = "0123456789\n!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~\n©®™￥€$£";
                    break;
            }
            sampleText.value = text;
        };

        // Initialize UI values
        sampleText.style.fontSize = `${fontSize.value}px`;
        sampleText.style.color = fontColor.value;

    </script>
</body>
</html>
